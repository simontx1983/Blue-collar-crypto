name: CI

# Cross-repo guards. The plugin + frontend code lives in separate repos, so
# this job reassembles the WordPress/monorepo layout (root repo at the root,
# the public sibling repos checked out into their dev paths) and runs the
# static guards that span the contract docs (this repo) and the code (the
# sibling repos).
#
# Triggers on changes to THIS repo (docs/scripts) and, via
# repository_dispatch:[sibling-push], on every push to a sibling plugin's
# main. A plugin PR (not yet merged) does not trigger it — run it manually
# with "Run workflow" if you need the check before merging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Fired by each sibling repo's "Notify cross-repo guards" workflow on push to
  # main, so a route/contract change in a plugin re-runs these guards against
  # the new code immediately — not only when this repo's docs change.
  repository_dispatch:
    types: [sibling-push]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Cross-repo guards — contract · subsystem · cadence · dead-file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-trust
          path: app/public/wp-content/plugins/bcc-trust
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-core
          path: app/public/wp-content/plugins/bcc-core
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-search
          path: app/public/wp-content/plugins/bcc-search
      - uses: actions/checkout@v4
        with:
          repository: simontx1983/bcc-frontend
          path: bcc-frontend

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Contract-vs-code parity
        run: php scripts/contract-parity-guard.php

      - name: Subsystem-count parity
        run: php scripts/subsystem-count-guard.php

      - name: Cadence-pressure policy
        run: bash scripts/cadence-pressure-guard.sh

      - name: Dead-file scan
        run: php scripts/dead-file-scan.php

      # Fail-closed regressions for the three guards above. Each must FAIL,
      # not pass over nothing, when a plugin root is missing, a parse yields
      # zero items, or a register_rest_route() site is unresolved. Also pins
      # contract-parity's METHOD+path matching: only a single EDITABLE-triple
      # config is covered by documenting one of its verbs, and a DELETE
      # sibling of a documented POST still fails. Runs copies of the guards
      # against throwaway fixture roots, independent of the sibling checkouts.
      - name: Guard fail-closed regressions
        run: bash scripts/tests/guards-fail-closed.test.sh

      # Static mode only (no DB env vars → the live-table/live-index checks
      # self-skip). Armed 2026-07-23 after the Tier-3 schema reconcile drove
      # the guard to zero findings (declared == documented == live). The live
      # check remains a manual/staging step — see the script header.
      - name: Schema-drift parity (static)
        run: php scripts/schema-drift-guard.php

      # Regression cases for the schema-drift guard's inventory Status
      # handling (#162): a declared table relabelled ORPHAN/RETIRED must fail,
      # the Status cell is matched exactly, and RETIREMENT_WINDOW entries fail
      # once stale. Runs a copy of the guard against a throwaway fixture root
      # — no DB, and independent of the sibling checkouts above.
      - name: Schema-drift guard regressions
        run: bash scripts/tests/schema-drift-guard.test.sh

      # Regression cases for the guard's column parity (CHECK 3, #132):
      # drift fails in both directions, an Active table needs a column block,
      # and the doc / migration idioms (name(K), multi-column rows, struck
      # columns, OPTIONAL rows, migration-map ADD COLUMNs, comment / tests /
      # scripts ALTERs) are each pinned. Same fixture model as above.
      - name: Schema-drift column-parity regressions
        run: bash scripts/tests/schema-column-parity.test.sh

      # Parser regression tests for scripts/site-url-probe.sh. Runs here, in
      # the already-required guards job, rather than in site-url-guard.yml:
      # that workflow only runs daily and on dispatch, so a broken parser
      # would not be caught until after it merged — which is exactly how the
      # envelope defect reached main.
      #
      # No network and no secret. `curl` is shadowed by a fake on PATH, so
      # every case is a fixed byte string; the fixture secret is a literal
      # that matches nothing.
      - name: site-url probe parser regressions
        run: bash scripts/tests/site-url-probe.test.sh

